name: Mobile Beta Deploy

on:
  push:
    tags:
      - 'v*.*.*'        # Trigger on version tags: v1.0.0, v1.2.3-beta, etc.
  workflow_dispatch:    # Allow manual trigger from GitHub UI
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options: [both, ios, android]

jobs:
  # ──────────────────────────────────────────────
  # iOS → TestFlight
  # ──────────────────────────────────────────────
  ios-beta:
    name: iOS → TestFlight
    runs-on: macos-latest
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Run iOS beta lane
        env:
          NEXT_PUBLIC_API_URL:          ${{ secrets.NEXT_PUBLIC_API_URL }}
          APPLE_ID:                     ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_TEAM_ID:    ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID:                   ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:              ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL:                ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:               ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER:                 ${{ github.run_number }}
          RELEASE_NOTES:                ${{ github.event.head_commit.message }}
        run: fastlane ios beta

  # ──────────────────────────────────────────────
  # Android → Play Store internal testing
  # ──────────────────────────────────────────────
  android-beta:
    name: Android → Play Store internal
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Add google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Run Android beta lane
        env:
          NEXT_PUBLIC_API_URL:          ${{ secrets.NEXT_PUBLIC_API_URL }}
          ANDROID_KEYSTORE_BASE64:      ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD:    ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:            ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:         ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY:         ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: fastlane android beta
